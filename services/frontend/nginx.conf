server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/products {
    proxy_pass http://product-service:8000/products;
    proxy_set_header Host $host;
  }

  location /api/orders {
    proxy_pass http://order-service:3000/orders;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
