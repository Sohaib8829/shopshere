---
- name: Deploy ShopSphere
  hosts: app
  become: true

  vars:
    app_dir: /opt/shopsphere
    aws_region: "{{ ecr_registry.split('.')[3] }}"

  tasks:
    - name: Install the AWS CLI (to log in to ECR with the instance role)
      ansible.builtin.apt:
        name: awscli
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy the production compose file
      ansible.builtin.copy:
        src: ../../deploy/docker-compose.prod.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Write the .env file (secrets, owner only)
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
        content: |
          REGISTRY={{ ecr_registry }}
          IMAGE_TAG={{ image_tag }}
          DB_HOST={{ db_host }}
          DB_PASSWORD={{ db_password }}
          CACHE_HOST={{ cache_host }}
          RABBITMQ_USER=shopsphere
          RABBITMQ_PASS={{ lookup('ansible.builtin.password', '~/.shopsphere/rabbitmq_password length=24 chars=ascii_letters,digits') }}
      no_log: true

    - name: Log in to ECR using the instance role
      ansible.builtin.shell: >
        aws ecr get-login-password --region {{ aws_region }} |
        docker login --username AWS --password-stdin {{ ecr_registry }}
      changed_when: false

    - name: Pull the images and start the stack
      ansible.builtin.command: docker compose up -d --pull always --remove-orphans
      args:
        chdir: "{{ app_dir }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Recreated' in compose_up.stderr or 'Created' in compose_up.stderr"

    - name: Wait until the store answers
      ansible.builtin.uri:
        url: http://localhost/api/products
        status_code: 200
      register: store
      until: store.status == 200
      retries: 30
      delay: 5

    - name: List the running containers
      ansible.builtin.command: docker compose ps
      args:
        chdir: "{{ app_dir }}"
      register: ps
      changed_when: false

    - name: Show the containers
      ansible.builtin.debug:
        var: ps.stdout_lines
